# Lefthook configuration for pre-commit hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  commands:
    lint:
      glob: "host-frontend-root/frontend-src-root/**/*.{ts,tsx,js,jsx}"
      run: "npm exec --prefix host-frontend-root/frontend-src-root -- eslint --config host-frontend-root/frontend-src-root/eslint.config.js --fix --rule 'simple-import-sort/imports: error' --rule 'simple-import-sort/exports: error' {staged_files}"
      stage_fixed: true
    stylelint:
      glob: "host-frontend-root/frontend-src-root/**/*.css"
      run: "npm exec --prefix host-frontend-root/frontend-src-root -- stylelint --config host-frontend-root/frontend-src-root/stylelint.config.js --fix {staged_files}"
      stage_fixed: true
    markdownlint:
      glob: "**/*.md"
      exclude: "node_modules/**|.git/**|.output/**|dist/**|host-frontend-root/**|worktrees/**|docs/user-stories/completed/**|docs/issues/completed/**"
      run: "npm exec --prefix host-frontend-root/frontend-src-root -- markdownlint-cli2 --fix {staged_files}"
      stage_fixed: true
