# Lefthook configuration for pre-commit hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  commands:
    lint:
      glob: "host-frontend-root/frontend-src-root/**/*.{ts,tsx,js,jsx}"
      run: "npm exec --prefix host-frontend-root/frontend-src-root -- eslint --fix --rule 'simple-import-sort/imports: error' --rule 'simple-import-sort/exports: error' {staged_files}"
      stage_fixed: true
