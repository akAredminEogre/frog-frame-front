# CodeRabbit Configuration
# https://docs.coderabbit.ai/guides/configure-coderabbit

language: "ja-JP"

reviews:
  auto_review:
    enabled: true
    base_branches:
      - ".*"

  # パス別のレビュー指示
  path_instructions:
    - path: "CLAUDE.md"
      instructions: |
        CLAUDE.mdはプロジェクトの主要なドキュメントです。変更時は以下を確認：
        - Makefileに存在するコマンドのみを記載しているか
        - .clinerules/内のワークフローと矛盾がないか
        - ディレクトリ構造の説明が実際の構造と一致しているか

    - path: "docs/**"
      instructions: |
        docsディレクトリ内のドキュメント変更時は以下を確認：
        - docs/docs-rules/に定義されたフォーマットに従っているか
        - 関連する他のドキュメントとの整合性があるか
        - テスト戦略書の場合、対応するテストファイルとの整合性を確認

    - path: ".clinerules/**"
      instructions: |
        .clinerules/の変更時は以下を確認：
        - CLAUDE.mdの関連セクションも更新が必要か
        - 他のワークフローファイルとの整合性があるか
        - コーディング規約の変更は実際のコードへの影響を確認

    - path: "src/**"
      instructions: |
        ソースコードの変更時は以下を確認：
        - 新規クラス/メソッド追加時はdocs/design/に対応するテスト戦略書が必要
        - publicなAPI変更時はCLAUDE.mdの更新が必要か確認
        - Clean Architectureのレイヤー依存関係が守られているか

    - path: "tests/**"
      instructions: |
        テストコードの変更時は以下を確認：
        - 対応するdocs/design/内のテスト戦略書と整合性があるか
        - テストファイルの構成がテスト戦略書の定義と一致しているか

    - path: "Makefile"
      instructions: |
        Makefileの変更時は以下を確認：
        - CLAUDE.mdの「Common Development Commands」セクションの更新が必要か
        - 新規コマンド追加時はドキュメントへの記載を確認

# コードガイドライン設定
# .AI/review-guidelines/ 配下のファイルをレビューガイドラインとして使用
knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      - ".AI/review-guidelines/**/*.md"
