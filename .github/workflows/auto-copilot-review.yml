name: Auto Copilot Review

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: copilot-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  auto-copilot-review:
    runs-on: ubuntu-latest
    # CI全ジョブがpassした場合のみ実行
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get PR number from head SHA
        id: get-pr
        uses: actions/github-script@v7
        with:
          script-file: scripts/ci/auto-copilot-review/get-pr.js

      - name: Check unresolved review threads
        id: check-threads
        if: steps.get-pr.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
        with:
          script-file: scripts/ci/auto-copilot-review/check-threads.js

      - name: Check if Copilot already requested
        id: check-copilot
        if: |
          steps.get-pr.outputs.pr_number != '' &&
          steps.check-threads.outputs.has_unresolved == 'false'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
        with:
          script-file: scripts/ci/auto-copilot-review/check-copilot.js

      - name: Request Copilot review
        if: |
          steps.get-pr.outputs.pr_number != '' &&
          steps.check-threads.outputs.has_unresolved == 'false' &&
          steps.check-copilot.outputs.skip == 'false'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
        with:
          script-file: scripts/ci/auto-copilot-review/request-review.js

      - name: Skip Copilot review (unresolved threads exist)
        if: |
          steps.get-pr.outputs.pr_number != '' &&
          steps.check-threads.outputs.has_unresolved == 'true'
        run: |
          echo "⏭️ Skipping Copilot review: ${{ steps.check-threads.outputs.unresolved_count }} unresolved thread(s) found"
