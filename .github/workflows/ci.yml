name: CI

on:
  pull_request:
    branches:
      - develop

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-frontend-root/frontend-src-root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: host-frontend-root/frontend-src-root/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup matchUrl.ts
        run: |
          if [ ! -f src/utils/matchUrl.ts ]; then
            cp src/utils/matchUrl.ts.example src/utils/matchUrl.ts
          fi

      - name: Prepare WXT
        run: npx wxt prepare

      - name: Run unit tests
        run: npm run test:unit

  check:
    name: Compile & Lint Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-frontend-root/frontend-src-root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: host-frontend-root/frontend-src-root/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup matchUrl.ts
        run: |
          if [ ! -f src/utils/matchUrl.ts ]; then
            cp src/utils/matchUrl.ts.example src/utils/matchUrl.ts
          fi

      - name: Prepare WXT
        run: npx wxt prepare

      - name: Run compile, knip, tsr, and lint checks
        run: npm run compile && (npm run knip:all || true) && (npm run tsr:check || true) && (npm run lint || true)

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-frontend-root/frontend-src-root
    env:
      EXTENSION_DIR: .output/chrome-mv3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: host-frontend-root/frontend-src-root/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup matchUrl.ts
        run: |
          if [ ! -f src/utils/matchUrl.ts ]; then
            cp src/utils/matchUrl.ts.example src/utils/matchUrl.ts
          fi

      - name: Prepare WXT
        run: npx wxt prepare

      - name: Build extension for E2E tests
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
